<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">InboxPay — bounded accounts payable</title>
  <desc id="desc">Invoices enter from Gmail, pass evidence and policy controls, and settle in USDC on Arc.</desc>
  <rect width="1500" height="500" fill="#f5f6f0"/>
  <rect width="1500" height="16" fill="#c9ef71"/>
  <g transform="translate(86 78)">
    <rect width="72" height="72" rx="18" fill="#c9ef71"/>
    <path d="M16 21h22M16 36h16M16 51h22M43 15v43M50 21h9M50 36h9M50 51h9" fill="none" stroke="#172033" stroke-width="5.5" stroke-linecap="round"/>
    <text x="94" y="51" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.5">InboxPay</text>
  </g>
  <text x="86" y="260" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5">The business inbox,</text>
  <text x="86" y="335" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5">with payment authority kept on a short leash.</text>
  <g transform="translate(90 407)">
    <circle cx="0" cy="0" r="7" fill="#172033"/><path d="M8 0h205" stroke="#cad1c3" stroke-width="2"/>
    <circle cx="220" cy="0" r="7" fill="#172033"/><path d="M228 0h205" stroke="#cad1c3" stroke-width="2"/>
    <circle cx="440" cy="0" r="7" fill="#172033"/><path d="M448 0h205" stroke="#cad1c3" stroke-width="2"/>
    <circle cx="660" cy="0" r="8" fill="#c9ef71" stroke="#172033" stroke-width="3"/>
    <text x="0" y="38" fill="#667060" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">GMAIL EVIDENCE</text>
    <text x="220" y="38" fill="#667060" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">AGENT DECISION</text>
    <text x="440" y="38" fill="#667060" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">POLICY CONTROL</text>
    <text x="660" y="38" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">ARC RECEIPT</text>
  </g>
  <text x="1415" y="451" text-anchor="end" fill="#667060" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">inboxpay.vercel.app</text>
</svg>
