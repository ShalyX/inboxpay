<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">InboxPay — bounded accounts payable</title>
  <desc id="desc">Invoices enter from Gmail, pass evidence and policy controls, and settle in USDC on Arc.</desc>
  <rect width="1200" height="630" fill="#f5f6f0"/>
  <rect width="1200" height="18" fill="#c9ef71"/>
  <rect x="64" y="64" width="64" height="64" rx="16" fill="#c9ef71"/>
  <path d="M77 82h19M77 95h14M77 108h19M101 77v38M107 82h8M107 95h8M107 108h8" fill="none" stroke="#172033" stroke-width="5" stroke-linecap="round"/>
  <text x="148" y="108" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="-1">InboxPay</text>
  <text x="64" y="240" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">The business inbox,</text>
  <text x="64" y="322" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">with payment authority</text>
  <text x="64" y="404" fill="#49702d" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">kept on a short leash.</text>
  <g transform="translate(66 487)">
    <path d="M0 26h185M225 26h185M450 26h185M675 26h185" stroke="#cad1c3" stroke-width="2"/>
    <circle cx="0" cy="26" r="8" fill="#172033"/><circle cx="225" cy="26" r="8" fill="#172033"/><circle cx="450" cy="26" r="8" fill="#172033"/><circle cx="675" cy="26" r="8" fill="#c9ef71" stroke="#172033" stroke-width="3"/>
    <text x="0" y="68" fill="#667060" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">GMAIL EVIDENCE</text>
    <text x="225" y="68" fill="#667060" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">AGENT DECISION</text>
    <text x="450" y="68" fill="#667060" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ONCHAIN POLICY</text>
    <text x="675" y="68" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ARC RECEIPT</text>
  </g>
  <text x="1110" y="585" text-anchor="end" fill="#7a8374" font-family="Arial, Helvetica, sans-serif" font-size="18">inboxpay.vercel.app</text>
</svg>
