name: Build policy vault artifact

on:
  push:
    branches: [main]
    paths:
      - "contracts/BusinessPolicyVault.sol"
      - "scripts/compile-policy.mjs"
      - "package.json"
      - ".github/workflows/build-policy-vault.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify compiler
        run: forge --version

      - name: Compile
        run: node scripts/compile-policy.mjs

      - name: Verify committed artifact
        run: git diff --exit-code -- contracts/artifacts/BusinessPolicyVault.json

      - name: Test contracts
        run: forge test
