name: Database restore drill

on:
  workflow_dispatch:
    inputs:
      backup_object_uri:
        description: Exact private gs:// URI of the encrypted .dump.gpg object
        required: true
        type: string
      disposable_database_confirmation:
        description: Type RESTORE_TO_DISPOSABLE_DATABASE
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  restore:
    if: ${{ inputs.disposable_database_confirmation == 'RESTORE_TO_DISPOSABLE_DATABASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inboxpay_restore
          POSTGRES_PASSWORD: inboxpay-restore-drill-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inboxpay_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RESTORE_DATABASE_URL: postgresql://postgres:inboxpay-restore-drill-local-only@127.0.0.1:5432/inboxpay_restore
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: tameion-ap-agent
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Pull PostgreSQL 17 client
        run: docker pull postgres:17-alpine

      - name: Restore into disposable database and verify core tables
        shell: bash
        env:
          BACKUP_OBJECT_URI: ${{ inputs.backup_object_uri }}
        run: |
          set -Eeuo pipefail
          : "${RESTORE_DATABASE_URL:?Missing RESTORE_DATABASE_URL secret}"
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Missing BACKUP_ENCRYPTION_PASSPHRASE secret}"
          [[ "$BACKUP_OBJECT_URI" == gs://*.dump.gpg ]] || { echo "Expected an exact gs:// URI ending in .dump.gpg"; exit 1; }

          gcloud storage cp "$BACKUP_OBJECT_URI" backup.dump.gpg --quiet
          gcloud storage cp "${BACKUP_OBJECT_URI}.sha256" backup.dump.gpg.sha256 --quiet
          expected_checksum="$(cut -d ' ' -f 1 backup.dump.gpg.sha256)"
          printf '%s  %s\n' "$expected_checksum" backup.dump.gpg | sha256sum --check
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --decrypt --output backup.dump backup.dump.gpg
          docker run --rm --interactive \
            --network host \
            -e RESTORE_DATABASE_URL \
            postgres:17-alpine \
            sh -c 'psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1' <<'SQL'
          create schema auth;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as 'select null::uuid';
          create function auth.role() returns text language sql stable as 'select null::text';
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL
          docker run --rm \
            --network host \
            -e RESTORE_DATABASE_URL \
            --volume "$PWD:/work" \
            --workdir /work \
            postgres:17-alpine \
            sh -c 'pg_restore --exit-on-error --no-owner --no-privileges --schema=public --section=pre-data --dbname="$RESTORE_DATABASE_URL" backup.dump'
          docker run --rm \
            --network host \
            -e RESTORE_DATABASE_URL \
            --volume "$PWD:/work" \
            --workdir /work \
            postgres:17-alpine \
            sh -c 'pg_restore --exit-on-error --no-owner --no-privileges --schema=public --section=data --dbname="$RESTORE_DATABASE_URL" backup.dump'
          docker run --rm --interactive \
            --network host \
            -e RESTORE_DATABASE_URL \
            postgres:17-alpine \
            sh -c 'psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1' <<'SQL'
          insert into auth.users (id)
          select owner_user_id from public.businesses
          union select user_id from public.integrations
          union select user_id from public.invoices
          union select user_id from public.policies
          union select user_id from public.audit_events
          union select user_id from public.invoice_execution_jobs
          union select user_id from public.wallet_withdrawals
          union select user_id from public.operations_service_states
          on conflict (id) do nothing;
          SQL
          docker run --rm \
            --network host \
            -e RESTORE_DATABASE_URL \
            --volume "$PWD:/work" \
            --workdir /work \
            postgres:17-alpine \
            sh -c 'pg_restore --exit-on-error --no-owner --no-privileges --schema=public --section=post-data --dbname="$RESTORE_DATABASE_URL" backup.dump'
          docker run --rm --interactive \
            --network host \
            -e RESTORE_DATABASE_URL \
            postgres:17-alpine \
            sh -c 'psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1' <<'SQL'
          do $$
          begin
            if (
              select count(*)
              from information_schema.tables
              where table_schema = 'public'
                and table_name in (
                  'businesses', 'business_network_accounts', 'integrations', 'invoices',
                  'policies', 'vendors', 'audit_events', 'invoice_execution_jobs',
                  'wallet_withdrawals', 'operations_service_states'
                )
            ) <> 10 then
              raise exception 'InboxPay core table verification failed';
            end if;
          end
          $$;
          SQL
          rm -f backup.dump backup.dump.gpg backup.dump.gpg.sha256
