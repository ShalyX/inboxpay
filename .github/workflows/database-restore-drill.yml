name: Database restore drill

on:
  workflow_dispatch:
    inputs:
      backup_object_uri:
        description: Exact private S3 URI of the encrypted .dump.gpg object
        required: true
        type: string
      disposable_database_confirmation:
        description: Type RESTORE_TO_DISPOSABLE_DATABASE
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    if: ${{ inputs.disposable_database_confirmation == 'RESTORE_TO_DISPOSABLE_DATABASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL and S3 clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Restore into disposable database and verify core tables
        shell: bash
        env:
          BACKUP_OBJECT_URI: ${{ inputs.backup_object_uri }}
        run: |
          set -Eeuo pipefail
          : "${RESTORE_DATABASE_URL:?Missing RESTORE_DATABASE_URL secret}"
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Missing BACKUP_ENCRYPTION_PASSPHRASE secret}"
          [[ "$BACKUP_OBJECT_URI" == s3://*.dump.gpg ]] || { echo "Expected an exact s3:// URI ending in .dump.gpg"; exit 1; }

          aws s3 cp "$BACKUP_OBJECT_URI" backup.dump.gpg --only-show-errors
          aws s3 cp "${BACKUP_OBJECT_URI}.sha256" backup.dump.gpg.sha256 --only-show-errors
          expected_checksum="$(cut -d ' ' -f 1 backup.dump.gpg.sha256)"
          printf '%s  %s\n' "$expected_checksum" backup.dump.gpg | sha256sum --check
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --decrypt --output backup.dump backup.dump.gpg
          pg_restore --exit-on-error --no-owner --no-privileges --dbname="$RESTORE_DATABASE_URL" backup.dump
          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if (
              select count(*)
              from information_schema.tables
              where table_schema = 'public'
                and table_name in (
                  'businesses', 'business_network_accounts', 'integrations', 'invoices',
                  'policies', 'vendors', 'audit_events', 'invoice_execution_jobs',
                  'wallet_withdrawals', 'operations_service_states'
                )
            ) <> 10 then
              raise exception 'InboxPay core table verification failed';
            end if;
          end
          $$;
          SQL
          rm -f backup.dump backup.dump.gpg backup.dump.gpg.sha256
