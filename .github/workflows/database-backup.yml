name: Encrypted database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: inboxpay-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_GCS_URI: ${{ vars.BACKUP_GCS_URI }}
      OPERATIONS_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
      OPERATIONS_ALERT_WEBHOOK_SECRET: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: tameion-ap-agent
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create, encrypt, and upload backup
        shell: bash
        run: |
          set -Eeuo pipefail
          notify_failure() {
            if [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_ALERT_CHAT_ID:-}" ]]; then
              curl --silent --show-error --fail --max-time 8 \
                -H "Content-Type: application/json" \
                --data "$(jq -nc --arg chat_id "$TELEGRAM_ALERT_CHAT_ID" --arg text $'InboxPay backup failed\nSeverity: critical\nAction: Inspect the GitHub Actions run and preserve the last verified backup.' '{chat_id:$chat_id,text:$text,disable_web_page_preview:true}')" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null || true
            elif [[ -n "${OPERATIONS_ALERT_WEBHOOK_URL:-}" ]]; then
              if [[ -n "${OPERATIONS_ALERT_WEBHOOK_SECRET:-}" ]]; then
                curl --silent --show-error --fail --max-time 8 \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${OPERATIONS_ALERT_WEBHOOK_SECRET}" \
                  --data '{"product":"InboxPay","event":"backup_failed","severity":"critical","detail":"The scheduled encrypted Supabase backup failed.","action":"Inspect the GitHub Actions run and preserve the last verified backup."}' \
                  "$OPERATIONS_ALERT_WEBHOOK_URL" >/dev/null || true
              else
                curl --silent --show-error --fail --max-time 8 \
                  -H "Content-Type: application/json" \
                  --data '{"product":"InboxPay","event":"backup_failed","severity":"critical","detail":"The scheduled encrypted Supabase backup failed.","action":"Inspect the GitHub Actions run and preserve the last verified backup."}' \
                  "$OPERATIONS_ALERT_WEBHOOK_URL" >/dev/null || true
              fi
            fi
          }
          trap notify_failure ERR
          : "${SUPABASE_DB_URL:?Missing SUPABASE_DB_URL secret}"
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Missing BACKUP_ENCRYPTION_PASSPHRASE secret}"
          : "${BACKUP_GCS_URI:?Missing BACKUP_GCS_URI repository variable}"

          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          dump="inboxpay-${stamp}.dump"
          encrypted="${dump}.gpg"
          checksum="${encrypted}.sha256"
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file="$dump"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$encrypted" "$dump"
          rm -f "$dump"
          sha256sum "$encrypted" > "$checksum"
          gcloud storage cp "$encrypted" "${BACKUP_GCS_URI%/}/$encrypted" --quiet
          gcloud storage cp "$checksum" "${BACKUP_GCS_URI%/}/$checksum" --quiet
          rm -f "$encrypted" "$checksum"
